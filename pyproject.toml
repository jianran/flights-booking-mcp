[project]
name = "flights-booking-mcp"
version = "0.1.0"
description = "Hybrid MCP server: Google Flights search + Duffel flight booking. Search without API keys, book via Duffel."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
    "fast-flights>=0.1.4",
]
license = { text = "MIT" }

[project.scripts]
flights-booking-mcp = "flights_booking_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flights_booking_mcp"]
